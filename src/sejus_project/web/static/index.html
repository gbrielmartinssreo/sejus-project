<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1117">
  <title>SEJUS · Agente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topo">
    <h1 class="topo-titulo">SEJUS · Agente</h1>
    <span class="topo-sub">Chat com o acervo normativo</span>
    <button id="limpar" class="botao topo-limpar" title="Limpar conversa" type="button">Limpar</button>
  </header>

  <main id="mensagens" class="mensagens" aria-live="polite"></main>

  <div id="overlay-campos" class="overlay" hidden>
    <form id="form-campos" class="painel-campos">
      <h2>Informar campos</h2>
      <p class="dica">Preencha os que souber; o restante é preenchido automaticamente.</p>
      <div id="campos-lista"></div>
      <div class="painel-acoes">
        <button type="button" id="cancelar-campos" class="botao">Cancelar</button>
        <button type="submit" class="botao primario">Enviar campos</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="modelo-status" class="modelo-status" hidden></div>

  <form id="formulario" class="formulario">
    <div class="barra-acoes">
      <label class="botao anexar" for="arquivo" title="Enviar arquivo para análise (.txt, .md, .pdf, .docx)">&#128206;</label>
      <input type="file" id="arquivo" accept=".txt,.md,.pdf,.docx" hidden>
      <label class="botao anexar modelo" for="arquivo-modelo" title="Enviar um ato existente como MODELO de formatação (.docx)">&#128196;</label>
      <input type="file" id="arquivo-modelo" accept=".docx" hidden>
      <span id="arquivo-nome" class="arquivo-nome"></span>
    </div>
    <textarea id="entrada" class="entrada" rows="1"
      placeholder="Ex.: Gere uma portaria sobre limpeza das unidades administrativas da SEJUS..." required></textarea>
    <button type="submit" class="botao primario enviar">Enviar</button>
  </form>

  <script src="/static/app.js"></script>
</body>
</html>
