<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1117">
  <title>SEJUS · Agente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body data-theme="dark">

  <header class="topo">
    <div class="brand">
      <span class="mark">SEJUS Agente</span>
      <span class="sub">Chat com o acervo normativo</span>
    </div>
    <div class="topo-direita">
      <div class="theme-toggle" role="group" aria-label="Alternar tema">
        <button id="btn-escuro" type="button" class="is-active" title="Tema escuro" aria-label="Tema escuro">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button id="btn-claro" type="button" title="Tema claro" aria-label="Tema claro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
      <button id="limpar" class="clear-btn" title="Limpar conversa" type="button">Limpar conversa</button>
    </div>
  </header>

  <main id="mensagens" class="mensagens" aria-live="polite"></main>

  <div id="overlay-campos" class="overlay" hidden>
    <form id="form-campos" class="painel-campos">
      <h2>Informar campos</h2>
      <p class="dica">Preencha os que souber; o restante é preenchido automaticamente.</p>
      <div id="campos-lista"></div>
      <div class="painel-acoes">
        <button type="button" id="cancelar-campos" class="botao">Cancelar</button>
        <button type="submit" class="botao primario">Enviar campos</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="modelo-status" class="modelo-status" hidden></div>

  <form id="formulario" class="formulario">
    <div class="barra-acoes">
      <label class="tool-btn" for="arquivo" title="Anexar arquivo (.txt, .md, .pdf, .docx)">
        <span class="tooltip">Anexar arquivo</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
      </label>
      <input type="file" id="arquivo" accept=".txt,.md,.pdf,.docx" hidden>
      <label class="tool-btn active" for="arquivo-melhorar" title="Melhorar e comparar (.txt, .md, .pdf, .docx)">
        <span class="tooltip">Melhorar e comparar</span>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4L12 2z"/><path d="M19 15l.8 2.4L22 18l-2.2.6L19 21l-.8-2.4L16 18l2.2-.6L19 15z" opacity=".6"/></svg>
      </label>
      <input type="file" id="arquivo-melhorar" accept=".txt,.md,.pdf,.docx" hidden>
      <label class="tool-btn" for="arquivo-modelo" title="Usar como modelo de formatação (.docx)">
        <span class="tooltip">Usar como modelo</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
      </label>
      <input type="file" id="arquivo-modelo" accept=".docx" hidden>
      <span id="arquivo-nome" class="arquivo-nome"></span>
    </div>
    <textarea id="entrada" class="entrada" rows="1"
      placeholder="Ex.: Gere uma portaria sobre limpeza das unidades administrativas da SEJUS..." required></textarea>
    <button type="submit" class="enviar">
      Enviar
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
