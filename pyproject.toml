[project]
name = "sejus-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gabriel Martins", email = "gbmmorais50@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "groq>=1.7.0",
    "markitdown[pdf]>=0.1.7",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "qdrant-client>=1.19.0",
    "rich>=15.0.0",
    "ruff>=0.16.5",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
sejus-project = "sejus_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
