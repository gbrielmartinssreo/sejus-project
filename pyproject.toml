[project]
name = "sejus-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gabriel Martins", email = "gbmmorais50@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "grimp>=3.17",
    "groq>=1.7.0",
    "markitdown[pdf]>=0.1.7",
    "openai>=2.0.0",
    "pydeps>=3.0.8",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "rich>=15.0.0",
    "ruff>=0.16.5",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
sejus-project = "sejus_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "code2flow>=2.5.1",
    "custom-tree>=1.7",
    "grimp>=3.17",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "pyan3>=2.8.1",
    "pytest>=9.1.1",
]
